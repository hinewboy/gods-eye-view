name: Deploy static build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static bundle with Pages base path
        run: npm run build -- --base=/gods-eye-view/
      - name: Fix Cesium asset location
        # vite-plugin-cesium copies its runtime under <dist>/<base>/cesium when a
        # non-root base is used, while index.html references <base>/cesium.
        run: |
          if [ -d dist/gods-eye-view/cesium ]; then
            mv dist/gods-eye-view/cesium dist/cesium
            rmdir dist/gods-eye-view 2>/dev/null || true
          fi
          test -f dist/cesium/Cesium.js
          test -f dist/cesium/Widgets/widgets.css
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
